<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111"><title>Feria Foto → Producto V5</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f5f5f7;color:#111}header{padding:18px 16px 8px;position:sticky;top:0;background:#f5f5f7ee;backdrop-filter:blur(14px);z-index:5}h1{font-size:22px;margin:0 0 4px}p{margin:4px 0;color:#666;font-size:13px}.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}.btn{border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;background:#111;color:white}.btn.secondary{background:white;color:#111;border:1px solid #ddd}.settings{display:flex;gap:8px;align-items:center;padding:0 16px 10px}.sw{border:1px solid #ccc;background:white;border-radius:999px;padding:8px 12px;font-size:13px}.sw.active{background:#111;color:#fff}.list{padding:8px 16px 100px;display:grid;gap:12px}.card{background:white;border-radius:18px;padding:12px;box-shadow:0 2px 10px #00000010;display:grid;grid-template-columns:92px 1fr;gap:12px}.thumb{width:92px;height:92px;border-radius:12px;object-fit:cover;background:#eee}.meta b{display:block;font-size:16px}.status{font-size:13px;margin-top:5px}.ok{color:#138a42}.work{color:#a06a00}.err{color:#c22}.actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.small{font-size:12px;padding:8px 10px;border-radius:10px;border:1px solid #ddd;background:#fff}.hidden{display:none}.drop{border:2px dashed #ccc;border-radius:16px;padding:22px;text-align:center;margin:8px 16px;color:#666}.foot{position:fixed;bottom:0;left:0;right:0;background:#fffefeea;backdrop-filter:blur(12px);padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}.foot .btn{width:100%}.badge{display:inline-block;font-size:11px;background:#eee;padding:3px 7px;border-radius:999px;margin-left:5px}
</style></head><body><header><h1>Feria Foto → Producto <span class="badge">V5</span></h1><p>Separación automática de producto · procesamiento en el dispositivo</p></header><div class="bar"><label class="btn">📷 Tomar foto<input id="camera" class="hidden" type="file" accept="image/*" capture="environment"></label><label class="btn secondary">🖼️ Galería<input id="gallery" class="hidden" type="file" accept="image/*" multiple></label></div><div class="settings"><span>Fondo:</span><button class="sw active" data-bg="white">Blanco</button><button class="sw" data-bg="dark">Oscuro</button></div><div id="drop" class="drop">Agrega una foto. Cada foto inicia su proceso automáticamente.</div><main id="list" class="list"></main><div class="foot"><button id="zip" class="btn">⬇️ Exportar seleccionadas (JPG)</button></div>
<script type="module">
import {FilesetResolver, InteractiveSegmenter, BrushMode} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/vision_bundle.mjs';
const MODEL='https://storage.googleapis.com/mediapipe-models/interactive_segmenter_v2/magic_touch/int8/1/interactive_segmentation.task';
const WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm';
const MAX=2999, state=new Map(); let bg='white', seg=null, initPromise=null;
const $=id=>document.getElementById(id); const list=$('list');
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()}
function render(){list.innerHTML=''; for(const x of state.values()){const d=document.createElement('article');d.className='card';d.innerHTML=`<img class="thumb" src="${x.preview||''}"><div class="meta"><b>${x.num||'Sin número'}</b><div class="status ${x.status==='Listo'?'ok':x.status==='Error'?'err':'work'}">${x.status}</div><div class="status">${x.info||''}</div><div class="actions"><button class="small" data-act="num">Número</button><button class="small" data-act="toggle">${x.selected?'✓ Seleccionada':'Seleccionar'}</button>${x.output?'<a class="small" download="producto.jpg" href="'+x.output+'">Ver/guardar</a>':''}</div></div>`;d.dataset.id=x.id;list.appendChild(d)}}
async function ensure(){if(seg)return seg;if(initPromise)return initPromise;initPromise=(async()=>{const vision=await FilesetResolver.forVisionTasks(WASM); const s=await InteractiveSegmenter.createFromOptions(vision,{baseOptions:{modelAssetPath:MODEL,delegate:'CPU'}}); seg=s; return s})().catch(e=>{initPromise=null;throw e});return initPromise}
function canvasFromBitmap(bitmap,maxSide=MAX){let w=bitmap.width,h=bitmap.height; if(Math.max(w,h)>maxSide){const k=maxSide/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{willReadFrequently:true}).drawImage(bitmap,0,0,w,h);return c}
function maskAt(arr,mw,mh,x,y){const fx=Math.max(0,Math.min(mw-1,x*(mw-1))),fy=Math.max(0,Math.min(mh-1,y*(mh-1)));const x0=Math.floor(fx),y0=Math.floor(fy),x1=Math.min(mw-1,x0+1),y1=Math.min(mh-1,y0+1),dx=fx-x0,dy=fy-y0;return arr[y0*mw+x0]*(1-dx)*(1-dy)+arr[y0*mw+x1]*dx*(1-dy)+arr[y1*mw+x0]*(1-dx)*dy+arr[y1*mw+x1]*dx*dy}
function compose(src,mask,mw,mh){const w=src.width,h=src.height,out=document.createElement('canvas');out.width=w;out.height=h;const o=out.getContext('2d',{willReadFrequently:true});o.fillStyle=bg==='white'?'#fff':'#111';o.fillRect(0,0,w,h);o.drawImage(src,0,0);const im=o.getImageData(0,0,w,h),d=im.data;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let a=maskAt(mask,mw,mh,x/(w-1),y/(h-1));a=Math.max(0,Math.min(1,(a-0.18)/0.64));const i=(y*w+x)*4;d[i+3]=Math.round(a*255)}o.putImageData(im,0,0);return out}
async function blobJpg(canvas){let quality=.96;let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality));while(blob&&blob.size>2999000&&quality>.72){quality-=.03;blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality))}if(blob&&blob.size>2999000){let c=canvas;while(blob.size>2999000&&Math.max(c.width,c.height)>1600){const k=.9,n=document.createElement('canvas');n.width=Math.round(c.width*k);n.height=Math.round(c.height*k);n.getContext('2d').drawImage(c,0,0,n.width,n.height);c=n;blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9))}}return blob}
async function process(x){try{x.status='Cargando IA…';render();const s=await ensure();const bmp=await createImageBitmap(x.file);const src=canvasFromBitmap(bmp,MAX);bmp.close();const image=src; s.setImage(image); const pts=[{x:.5,y:.5},{x:.43,y:.5},{x:.57,y:.5},{x:.5,y:.43},{x:.5,y:.57}]; const strokes=pts.map(p=>({brushMode:BrushMode.POSITIVE,point:[p],isCompleted:true}));x.status='Separando producto…';render();const t=performance.now();const res=s.segment(strokes);if(!res||!res.confidenceMasks?.length)throw Error('La IA no devolvió máscara');const m=res.confidenceMasks[0];const arr=m.getAsFloat32Array();const mw=m.width,mh=m.height;const out=compose(src,arr,mw,mh);m.close();res.close();const blob=await blobJpg(out);x.output=URL.createObjectURL(blob);x.preview=x.output;x.status='Listo';x.info=`${Math.round(blob.size/1024)} KB · ${out.width}×${out.height}px · ${(performance.now()-t)/1000|0}s`;render()}catch(e){console.error(e);x.status='Error';x.info=e?.message||String(e);render()}}
function add(file){const x={id:id(),file,num:'',status:'En cola…',selected:true,preview:URL.createObjectURL(file)};state.set(x.id,x);render();setTimeout(()=>{if(!x.num)x.num=prompt('Número de producto:', '')||'Sin número';render();process(x)},30)}
$('camera').onchange=e=>{const f=e.target.files?.[0];if(f)add(f);e.target.value=''};$('gallery').onchange=e=>{[...e.target.files].forEach(add);e.target.value=''};
list.onclick=e=>{const b=e.target.closest('button');if(!b)return;const x=state.get(e.target.closest('.card').dataset.id);if(b.dataset.act==='toggle'){x.selected=!x.selected;render()}else if(b.dataset.act==='num'){x.num=prompt('Número de producto:',x.num)||x.num;render()}};
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{bg=b.dataset.bg;document.querySelectorAll('.sw').forEach(q=>q.classList.remove('active'));b.classList.add('active')});
$('zip').onclick=async()=>{const xs=[...state.values()].filter(x=>x.selected&&x.output);if(!xs.length)return alert('No hay fotos procesadas seleccionadas.');const files=await Promise.all(xs.map(async x=>({name:(x.num||x.id)+'.jpg',data:new Uint8Array(await (await fetch(x.output)).arrayBuffer())})));const zip=makeZip(files);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([zip],{type:'application/zip'}));a.download='feria_fotos_producto.zip';a.click()};
function crc32(b){let c=~0;for(const v of b){c^=v;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (~c)>>>0}function u16(v){return new Uint8Array([v&255,v>>8&255])}function u32(v){return new Uint8Array([v&255,v>>8&255,v>>16&255,v>>24&255])}function cat(a,b){const r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r}function makeZip(fs){let out=new Uint8Array(0),central=[],offset=0;for(const f of fs){const n=new TextEncoder().encode(f.name),d=f.data,c=crc32(d);const h=cat(cat(cat(new Uint8Array([80,75,3,4,20,0,0,0,0,0]),u16(0)),u16(n.length)),cat(u32(c),cat(u32(d.length),cat(u32(d.length),n))));out=cat(out,cat(h,d));central.push({n,c,size:d.length,off:offset});offset=out.length}let cd=new Uint8Array(0);for(const f of central){const h=cat(new Uint8Array([80,75,1,2,20,0,20,0,0,0,0,0]),cat(u16(0),cat(u16(0),cat(u16(0),cat(u16(f.n.length),cat(u16(0),cat(u32(f.c)),cat(u32(f.size),cat(u32(f.size),cat(u16(0),cat(u16(0),cat(u16(0),cat(u16(0),cat(u32(0),cat(u32(f.off),f.n)))))))))))))));cd=cat(cd,h)}const e=cat(new Uint8Array([80,75,5,6,0,0,0,0]),cat(u16(fs.length),cat(u16(fs.length),cat(u32(cd.length),cat(u32(out.length),cat(u16(0),cd))))));return cat(out,e)}
render(); ensure().then(()=>console.log('IA lista')).catch(e=>console.warn('IA no disponible',e));
</script></body></html>
